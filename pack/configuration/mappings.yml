# Widens the pools this pack borrows from.
#
# Chorus plant: the Farmer's Delight pack maps its jug's state to the empty model,
# so every chorus state can carry a jam bottle. Only the single state the bottles
# share is declared here; the rest are left to the other packs.
#
# Spruce and birch leaves ship commented out in CraftEngine's own mappings, so their
# states belong to no group. Declaring the dry ones adds them to the non-tintable
# leaf pool, exactly like the Farmer's Delight pack does for campfires and farmland.
block_state_mappings:
  #### Chorus Plant ####
  chorus_plant[down=true,east=false,north=false,south=false,up=true,west=false]: chorus_plant[down=true,east=false,north=false,south=false,up=true,west=false]

