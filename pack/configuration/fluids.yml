# Generated from the Fruits Delight mod by the YuanGuoDelight build script.
# Registers one jam fluid per fruit with NyanaFluid, the fluid library Farmer's Delight 1.2.4 uses.
# The jam bottle is declared as the "bottle" container, so a jug recognises it natively.
nyana-fluid:fluids:
  yuanguo:apple_jam:
    display_name: '<!i><lang:fluid.yuanguo.apple_jam>'
    color: '#C3833D'
    texture: 'minecraft:block/water_still'
    display_item: 'yuanguo:apple_jelly'
    bottle: 'yuanguo:apple_jelly'
    sounds:
      fill: 'minecraft:item.bottle.fill'
      empty: 'minecraft:item.bottle.empty'
