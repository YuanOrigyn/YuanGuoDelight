# Generated from the Fruits Delight mod by the YuanGuoDelight build script.
blocks:
  yuanguo:pear_leaves:
    loot:
      pools:
      - rolls: 1
        conditions:
        - type: survives_explosion
        entries:
        - type: alternatives
          children:
          - type: item
            item: yuanguo:pear_leaves
            conditions:
            - type: any_of
              terms:
              - type: match_item
                id: minecraft:shears
              - type: enchantment
                predicate: minecraft:silk_touch>=1
          - type: item
            item: yuanguo:pear
            conditions:
            - type: match_block_property
              properties:
                type: fruits
            functions:
            - type: apply_bonus
              enchantment: minecraft:fortune
              formula:
                type: binomial_with_bonus_count
                extra: 1
                probability: 0.5
          - type: item
            item: yuanguo:pear_sapling
            conditions:
            - type: table_bonus
              enchantment: minecraft:fortune
              chances:
              - 0.05
              - 0.0625
              - 0.083333333
              - 0.1
    settings:
      template:
      - default:settings/leaves
      overrides:
        item: yuanguo:pear_leaves
        map_color: plant
    behavior:
    - type: yuanguo:seasonal_fruit_leaves
      season: SPRING
      fruit: yuanguo:pear
      sapling: yuanguo:pear_sapling
      fruit_min: 1
      fruit_max: 2
      ripen_chance: 0.3
      synchronized: true
      fruit_chance: 0.3
    states:
      properties:
        type:
          type: string
          values:
          - leaves
          - flowers
          - fruits
          default: leaves
      appearances:
        leaves:
          auto_state: non_tintable_leaves
          model:
            path: yuanguo:block/pear_leaves
        flowers:
          auto_state: non_tintable_leaves
          model:
            path: yuanguo:block/pear_flowers
        fruits:
          auto_state: non_tintable_leaves
          model:
            path: yuanguo:block/pear_fruits
      variants:
        type=leaves:
          appearance: leaves
        type=flowers:
          appearance: flowers
        type=fruits:
          appearance: fruits
