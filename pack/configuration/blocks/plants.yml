# Generated from the Fruits Delight mod by the YuanGuoDelight build script.
blocks:
  yuanguo:pear_sapling:
    loot:
      template: default:loot_table/self
    settings:
      template:
      - default:settings/sapling
      overrides:
        item: yuanguo:pear_sapling
        is_suffocating: false
        is_view_blocking: false
        can_occlude: false
        is_redstone_conductor: false
        tags:
        - minecraft:mineable/axe
        - minecraft:saplings
        - minecraft:sword_efficient
    behavior:
    - type: bush_block
      bottom_blocks:
      - minecraft:dirt
      - minecraft:grass_block
      - minecraft:podzol
      - minecraft:coarse_dirt
      - minecraft:rooted_dirt
      - minecraft:moss_block
      - minecraft:mud
      - minecraft:farmland
      - minecraft:mycelium
    - type: yuanguo:seasonal_sapling
      season: SPRING
      feature: yuanguo:tree/pear_tree
      bone_meal_success_chance: 0.45
      grow_speed: 0.1
    states:
      properties:
        stage:
          type: int
          default: 0
          min: 0
          max: 1
      appearances:
        sapling:
          auto_state: cave_vines
          model:
            path: yuanguo:block/pear_sapling
      variants:
        stage=0:
          appearance: sapling
        stage=1:
          appearance: sapling
  yuanguo:potted_pear_sapling:
    loot:
      pools:
      - rolls: 1
        entries:
        - type: item
          item: yuanguo:pear_sapling
          functions:
          - type: set_count
            count: 1
      - rolls: 1
        entries:
        - type: item
          item: minecraft:flower_pot
          functions:
          - type: set_count
            count: 1
    settings:
      template:
      - default:sound/stone
      - default:hardness/none
      overrides:
        is_suffocating: false
        is_view_blocking: false
        can_occlude: false
        is_redstone_conductor: false
        push_reaction: destroy
    behavior:
    - type: yuanguo:potted_sapling
    state:
      state: minecraft:flower_pot
