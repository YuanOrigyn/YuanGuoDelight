# Generated from the Fruits Delight mod by the YuanGuoDelight build script.
blocks:
  yuanguo:hamimelon:
    loot:
      pools:
      - rolls: 1
        entries:
        - type: alternatives
          children:
          - type: item
            item: yuanguo:hamimelon
            conditions:
            - type: enchantment
              predicate: minecraft:silk_touch>=1
          - type: item
            item: yuanguo:hamimelon_slice
            functions:
            - type: set_count
              count: 3~7
              add: false
            - type: apply_bonus
              enchantment: minecraft:fortune
              formula:
                type: ore_drops
            - type: limit_count
              max: 9
            - type: explosion_decay
    settings:
      template:
      - default:sound/wood
      - default:hardness/melon
      overrides:
        item: yuanguo:hamimelon
        map_color: plant
        push_reaction: destroy
        tags:
        - minecraft:enderman_holdable
        - minecraft:mineable/axe
        - minecraft:sword_efficient
    state:
      auto_state: solid
      model:
        path: yuanguo:block/hamimelon
  yuanguo:hamimelon_stem:
    loot:
      template: default:loot_table/crop
      arguments:
        crop_item: yuanguo:hamimelon_seeds
        ripe_age: 7
    settings:
      template:
      - default:sound/stem_crop
      - default:hardness/none
      overrides:
        item: yuanguo:hamimelon_seeds
        push_reaction: destroy
        is_suffocating: false
        is_view_blocking: false
        can_occlude: false
        is_redstone_conductor: false
        map_color: plant
        tags:
        - minecraft:crops
        - minecraft:maintains_farmland
    behavior:
    - type: yuanguo:seasonal_stem
      season: SUMMER
      fruit: yuanguo:hamimelon
      attached_stem: yuanguo:attached_hamimelon_stem
      light_requirement: 9
    - type: bush_block
      bottom_blocks:
      - minecraft:farmland
      - farmersdelight:rich_soil_farmland
    states:
      properties:
        age:
          type: int
          default: 0
          min: 0
          max: 7
      appearances:
        age=0:
          auto_state: higher_tripwire
          model:
            path: yuanguo:block/hamimelon_stem_stage0
        age=1:
          auto_state: higher_tripwire
          model:
            path: yuanguo:block/hamimelon_stem_stage1
        age=2:
          auto_state: higher_tripwire
          model:
            path: yuanguo:block/hamimelon_stem_stage2
        age=3:
          auto_state: higher_tripwire
          model:
            path: yuanguo:block/hamimelon_stem_stage3
        age=4:
          auto_state: higher_tripwire
          model:
            path: yuanguo:block/hamimelon_stem_stage4
        age=5:
          auto_state: higher_tripwire
          model:
            path: yuanguo:block/hamimelon_stem_stage5
        age=6:
          auto_state: higher_tripwire
          model:
            path: yuanguo:block/hamimelon_stem_stage6
        age=7:
          auto_state: higher_tripwire
          model:
            path: yuanguo:block/hamimelon_stem_stage7
      variants:
        age=0:
          appearance: age=0
        age=1:
          appearance: age=1
        age=2:
          appearance: age=2
        age=3:
          appearance: age=3
        age=4:
          appearance: age=4
        age=5:
          appearance: age=5
        age=6:
          appearance: age=6
        age=7:
          appearance: age=7
  yuanguo:attached_hamimelon_stem:
    loot:
      template: default:loot_table/crop
      arguments:
        crop_item: yuanguo:hamimelon_seeds
        ripe_age: 7
    settings:
      template:
      - default:sound/wood
      - default:hardness/none
      overrides:
        item: yuanguo:hamimelon_seeds
        push_reaction: destroy
        is_suffocating: false
        is_view_blocking: false
        can_occlude: false
        is_redstone_conductor: false
        map_color: plant
        tags:
        - minecraft:crops
        - minecraft:maintains_farmland
    behavior:
    - type: attached_stem_block
      fruit: yuanguo:hamimelon
      stem: yuanguo:hamimelon_stem
    - type: bush_block
      bottom_blocks:
      - minecraft:farmland
      - farmersdelight:rich_soil_farmland
    states:
      properties:
        facing:
          type: horizontal_direction
          default: north
      appearances:
        facing=north:
          state: attached_melon_stem[facing=north]
          model:
            path: yuanguo:block/attached_hamimelon_stem
            y: 90
        facing=east:
          state: attached_melon_stem[facing=east]
          model:
            path: yuanguo:block/attached_hamimelon_stem
            y: 180
        facing=south:
          state: attached_melon_stem[facing=south]
          model:
            path: yuanguo:block/attached_hamimelon_stem
            y: 270
        facing=west:
          state: attached_melon_stem[facing=west]
          model:
            path: yuanguo:block/attached_hamimelon_stem
      variants:
        facing=north:
          appearance: facing=north
        facing=east:
          appearance: facing=east
        facing=south:
          appearance: facing=south
        facing=west:
          appearance: facing=west
  # box without blocking the neighbours the way a full cube would.
  # It is not obtainable as an item; it ripens into a falling durian or dies with its leaf.
  yuanguo:hanging_durian:
    loot:
      pools:
      - rolls: 1
        conditions:
        - type: survives_explosion
        - type: match_block_property
          properties:
            type: fruits
        entries:
        - type: item
          item: yuanguo:durian
    settings:
      template:
      - default:sound/grass
      - default:hardness/none
      overrides:
        push_reaction: destroy
        is_suffocating: false
        is_view_blocking: false
        can_occlude: false
        is_redstone_conductor: false
        map_color: plant
        tags:
        - minecraft:sword_efficient
    behavior:
      type: yuanguo:hanging_fruit
      season: SUMMER
      falling_block: yuanguo:durian
      grow_chance: 0.1
      drop_chance: 0.1
    states:
      properties:
        type:
          type: string
          values:
          - flowers
          - fruits
          default: flowers
      appearances:
        flowers:
          state: minecraft:small_dripleaf[facing=north,half=lower,waterlogged=false]
          model:
            path: yuanguo:block/durian_flowers
        fruits:
          state: minecraft:small_dripleaf[facing=south,half=lower,waterlogged=false]
          model:
            path: yuanguo:block/durian_small
      variants:
        type=flowers:
          appearance: flowers
        type=fruits:
          appearance: fruits
  yuanguo:durian:
