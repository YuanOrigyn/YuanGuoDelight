# =============================================================================
# Yuan来是果 (YuanGuoDelight) 配置文件
# =============================================================================

# 调试日志
debug: false

# -----------------------------------------------------------------------------
# 季节联动 (RealisticSeasons)
# -----------------------------------------------------------------------------
season:
  # 总开关。false = 所有果树/作物全年生长，忽略季节。
  enabled: true

  # 自动检测。true = 服务器安装了 RealisticSeasons 时自动启用季节联动
  # (即使上面的 enabled 为 false 也会自动开启)。
  # 想彻底关闭季节联动时，把这里和上面的 enabled 都设为 false。
  auto-detect: true

  # 季节切换时在控制台输出一行日志。
  notify-season-change: false

  growth:
    # true  = 只有对应季节才能生长/结果 (最贴近原 mod + 季节插件的表现)。
    # false = 任何季节都能生长，但非当季速度会变慢。
    restrict-growth: true

    # 当季生长倍率。1.0 = 原版速度。
    in-season-multiplier: 1.0

    # 非当季生长倍率。仅在 restrict-growth: false 时生效。
    # 0.25 表示只有 25% 的机率推进一次生长。
    out-of-season-multiplier: 0.25

# -----------------------------------------------------------------------------
# 内容部署
# -----------------------------------------------------------------------------
pack:
  # 插件启动时把内置内容释放到服务器上:
  #   plugins/CraftEngine/resources/YuanGuoDelight/
  # 内容包里包含方块、物品、合成配方，以及由 PapersDelight 加载的
  # 厨锅 / 砧板配方 (papersdelight_recipes 章节)。
  # false = 改为手动放置 (适合需要自己改包的情况)。
  auto-install: true

  # ---------------------------------------------------------------------------
  # 炼药锅
  # ---------------------------------------------------------------------------
  # 果酱炼药锅的整套流程（榨汁、熬酱、装瓶、放出来）由插件实现。
  # 关掉后所有炼药锅方块仍然存在，但右键不再有反应。
  cauldron: true

  # true  = 每次启动都用内置内容覆盖服务器上的那一份
  #         (会覆盖你对内容包做的修改)。
  # false = 只在未安装或插件版本更新时写入。
  overwrite: false
# -----------------------------------------------------------------------------
# 状态效果 (buff / debuff)
# -----------------------------------------------------------------------------
# 食物吃掉后获得的状态效果。效果数值表由构建脚本从原 mod 生成，内置于 jar，
# 不需要在这里改。这里只控制整套系统是否启用，以及计时条的显示方式。
effects:
  # 总开关。false = 吃东西不再获得任何原 mod 的自定义效果（原版效果照常）。
  enabled: true

  # 用 Boss 血条显示自定义效果的剩余时间。
  # Minecraft 不允许插件注册新的药水类型，所以自定义效果没有原版的图标和倒计时，
  # 这条血条用来还原那份反馈。
  boss-bar: true

  # 单独关闭某个效果。填效果 id（yuanguo: 前缀可省略），例如:
  #   disabled:
  #     - yuanguo:chorus
  #     - refreshing
  # 被关闭的效果吃东西时不会再获得，但原版效果（力量、速度等）不受影响。
  disabled: []

  # 单独关掉某个效果的倒计时血条（效果本身仍然生效）。写法同上。
  bar-disabled: []
